<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSS Integration</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        th {
            background-color: #f4f4f4;
            text-align: left;
        }
    </style>
</head>

<body>
    <h1>Google Sheets Integration</h1>
    <form id="gss-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <button type="button" id="get-button">GET</button>
        <button type="button" id="post-button">POST</button>
    </form>
    <div id="result">
        <table id="data-table">
            <thead>
                <tr id="header-row"></tr>
            </thead>
            <tbody id="data-rows"></tbody>
        </table>
    </div>

    <script>
        const apiUrl = 'https://script.google.com/macros/s/AKfycbwXLjQKi4OUimKubtIG_IOQlaSGeqfQfhjJB6Z6Sok/dev'; // Google Apps Scriptの公開WebアプリURLを指定
        //https://script.google.com/macros/s/AKfycbwXLjQKi4OUimKubtIG_IOQlaSGeqfQfhjJB6Z6Sok/dev

        document.getElementById('get-button').addEventListener('click', () => {
            const name = document.getElementById('name').value;
            if (!name) {
                alert('Please enter a name.');
                return;
            }
            fetch(`${apiUrl}?action=get&name=${encodeURIComponent(name)}`)
                .then(response => response.json())
                .then(data => {
                    const headerRow = document.getElementById('header-row');
                    const dataRows = document.getElementById('data-rows');
                    headerRow.innerHTML = '';
                    dataRows.innerHTML = '';

                    if (data.columns.length > 0) {
                        // ヘッダー行の作成
                        data.columns.forEach(col => {
                            const th = document.createElement('th');
                            th.textContent = col;
                            headerRow.appendChild(th);
                        });

                        // データ行の作成
                        data.rows.forEach(row => {
                            const tr = document.createElement('tr');
                            row.forEach(cell => {
                                const td = document.createElement('td');
                                td.textContent = cell;
                                tr.appendChild(td);
                            });

                            // 空行にチェックボックスを追加
                            if (row.every(cell => cell === '')) {
                                const td = document.createElement('td');
                                const checkbox = document.createElement('input');
                                checkbox.type = 'checkbox';
                                checkbox.className = 'row-checkbox';
                                td.appendChild(checkbox);
                                tr.appendChild(td);
                            }

                            dataRows.appendChild(tr);
                        });
                    }
                })
                .catch(error => console.error('Error fetching data:', error));
        });

        document.getElementById('post-button').addEventListener('click', () => {
            const name = document.getElementById('name').value;
            if (!name) {
                alert('Please enter a name.');
                return;
            }

            const checkboxes = document.querySelectorAll('.row-checkbox');
            const checkedIndexes = Array.from(checkboxes).map((cb, index) => cb.checked ? index : -1).filter(index => index >= 0);

            fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ action: 'post', name, checkedIndexes }),
            })
                .then(response => response.json())
                .then(data => alert('Data updated successfully!'))
                .catch(error => console.error('Error posting data:', error));
        });
    </script>
</body>

</html>
