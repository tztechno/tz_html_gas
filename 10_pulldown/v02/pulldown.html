<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>スプレッドシート連携</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 20px 0;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .btn {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <button onclick="loadData()" class="btn">表示</button>
    <button onclick="saveChanges()" class="btn">決定</button>
    <div id="tableContainer"></div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyywsf7Y1GzwLsDd7qowdS2ZpvQgGuEiZgsTUvl7g23ZV9i_ldukrB8B_Z8kBtubywH_A/exec';
        let currentData = [];
        let originalSelectValues = new Map();

        async function loadData() {
            try {
                const response = await fetch(GAS_URL);
                const json = await response.json();
                currentData = json.data;
                displayData(currentData);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function displayData(data) {
            const container = document.getElementById('tableContainer');
            const table = document.createElement('table');
            originalSelectValues.clear();

            const headerRow = document.createElement('tr');
            data[0].forEach(header => {
                const th = document.createElement('th');
                th.textContent = header;
                headerRow.appendChild(th);
            });
            table.appendChild(headerRow);

            for (let i = 1; i < data.length; i++) {
                const row = document.createElement('tr');
                data[i].forEach((cell, cellIndex) => {
                    const td = document.createElement('td');
                    if (data[0][cellIndex] === 'pulldown') {
                        const select = document.createElement('select');
                        select.dataset.row = i;
                        ['作業前', '作業中', '作業済'].forEach(option => {
                            const opt = document.createElement('option');
                            opt.value = option;
                            opt.textContent = option;
                            if (cell === option) opt.selected = true;
                            select.appendChild(opt);
                        });
                        originalSelectValues.set(i, cell);
                        td.appendChild(select);
                    } else {
                        td.textContent = cell;
                    }
                    row.appendChild(td);
                });
                table.appendChild(row);
            }

            container.innerHTML = '';
            container.appendChild(table);
        }

        async function saveChanges() {
            const selects = document.querySelectorAll('select');
            const updates = [];

            for (const select of selects) {
                const row = parseInt(select.dataset.row);
                const newValue = select.value;
                const originalValue = originalSelectValues.get(row);

                if (newValue !== originalValue) {
                    updates.push({
                        row: row,
                        value: newValue,
                        progress: {
                            '作業前': 0,
                            '作業中': 1,
                            '作業済': 2
                        }[newValue]
                    });
                }
            }

            for (const update of updates) {
                try {
                    const response = await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify(update)
                    });
                    const json = await response.json();
                    if (!json.success) {
                        console.error('更新に失敗しました');
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            }

            if (updates.length > 0) {
                loadData();
            }
        }
    </script>
</body>

</html>
