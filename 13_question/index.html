<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>アンケート</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .survey-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .survey-button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 5px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <div class="survey-container">
        <h1>アンケート</h1>
        <p>質問: あなたの今日の気分は？</p>

        <button class="survey-button" onclick="submitSurvey('good')">
            良い
        </button>

        <button class="survey-button" onclick="submitSurvey('normal')">
            普通
        </button>

        <button class="survey-button" onclick="submitSurvey('bad')">
            悪い
        </button>
    </div>

    <div id="message"></div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwSxoI_PC4YJUOsW1iDumjcu2JT_9TvO-trHCgt5zbBC73qRCGZu89Eb7ETTAxMYBke/exec';
        const messageEl = document.getElementById('message');

        function showMessage(text) {
            messageEl.textContent = text;
            messageEl.style.display = 'block';

            // 2秒後に自動的にメッセージを消す
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 2000);
        }

        async function submitSurvey(answer) {
            try {
                const formData = new FormData();
                formData.append('answer', answer);

                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.text();
                showMessage(result);
            } catch (error) {
                console.error('Error:', error);
                showMessage('送信に失敗しました');
            }
        }
    </script>
</body>

</html>
