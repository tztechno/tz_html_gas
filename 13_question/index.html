<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>アンケート</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            font-size: 20px;
        }

        .survey-container {
            max-width: 400px;
            margin: 0 auto;
        }

        .survey-button {
            width: 100%;
            padding: 5px;
            margin: 5px 0;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 5px;
            display: none;
            z-index: 1000;
        }
    </style>

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@IshiiStpete" />
    <meta name="twitter:title" content=“question”>
    <meta name="twitter:image" content="https://raw.githubusercontent.com/tztechno/tz_html_gas/main/13_question/q.png">

</head>

<body>
    <div class="survey-container">
        <p>復帰して欲しい芸能人は？</p>

        <button class="survey-button" onclick="submitSurvey('good')">
            松本人志
        </button>

        <button class="survey-button" onclick="submitSurvey('中居正広')">
            中居正広
        </button>

        <button class="survey-button" onclick="submitSurvey('笑福亭鶴瓶')">
            笑福亭鶴瓶
        </button>

        <button class="survey-button" onclick="submitSurvey('TKO木下')">
            TKO木下
        </button>

        <button class="survey-button" onclick="submitSurvey('斉藤慎二')">
            ジャングルポケット・斉藤慎二
        </button>

        <button class="survey-button" onclick="submitSurvey('特になし')">
            特になし
        </button>


    </div>

    <div id="message"></div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwSxoI_PC4YJUOsW1iDumjcu2JT_9TvO-trHCgt5zbBC73qRCGZu89Eb7ETTAxMYBke/exec';
        const messageEl = document.getElementById('message');

        function showMessage(text) {
            messageEl.textContent = text;
            messageEl.style.display = 'block';

            // 2秒後に自動的にメッセージを消す
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 2000);
        }

        async function submitSurvey(answer) {
            try {
                const formData = new FormData();
                formData.append('answer', answer);

                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.text();
                showMessage(result);
            } catch (error) {
                console.error('Error:', error);
                showMessage('送信に失敗しました');
            }
        }
    </script>
</body>

</html>
