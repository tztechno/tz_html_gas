<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>アンケート</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .survey-container {
            max-width: 400px;
            margin: 0 auto;
        }

        .survey-button {
            width: 100%;
            padding: 5px;
            margin: 5px 0;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="survey-container">
        <h1>アンケート</h1>
        <p>質問: あなたの今日の気分は？</p>

        <button class="survey-button" onclick="submitSurvey('good')">
            良い
        </button>

        <button class="survey-button" onclick="submitSurvey('normal')">
            普通
        </button>

        <button class="survey-button" onclick="submitSurvey('bad')">
            悪い
        </button>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwSxoI_PC4YJUOsW1iDumjcu2JT_9TvO-trHCgt5zbBC73qRCGZu89Eb7ETTAxMYBke/exec';

        async function submitSurvey(answer) {
            try {
                const formData = new FormData();
                formData.append('answer', answer);

                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.text();
                alert(result);
            } catch (error) {
                console.error('Error:', error);
                alert('送信に失敗しました');
            }
        }
    </script>
</body>

</html>
