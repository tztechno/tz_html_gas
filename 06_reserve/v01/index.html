<!DOCTYPE html>
<html>

<head>
    <title>Plan Data</title>
    <style>
        .container {
            padding-left: 100px;
            padding-right: 100px;
        }

        #resultTable {
            width: 90%;
            border-collapse: collapse;
            margin-top: 20px;
        }
    </style>
    <script>
        let currentData = [];
        const YOUR_SCRIPT_ID = 'xxxxx';

        async function fetchPlanData() {
            const name = document.getElementById("nameInput").value;
            const response = await fetch(
                `https://script.google.com/macros/s/${YOUR_SCRIPT_ID}/exec?name=${name}`
            );
            const data = await response.json();
            currentData = data.rows;
            displayTable(data.rows);
        }

        function displayTable(rows) {
            const table = document.getElementById("resultTable");
            table.innerHTML = "";

            rows.forEach((row, rowIndex) => {
                const tr = document.createElement("tr");
                row.forEach((cell, colIndex) => {
                    const td = document.createElement("td");
                    if (rowIndex === 3 && colIndex > 0) {
                        const checkbox = document.createElement("input");
                        checkbox.type = "checkbox";
                        checkbox.name = `col${colIndex}`;
                        td.appendChild(checkbox);
                    } else {
                        td.textContent = cell || "";
                    }
                    tr.appendChild(td);
                });
                table.appendChild(tr);
            });
        }

        function sendData() {
            const name = document.getElementById("nameInput").value;
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            const checkedCols = [];

            checkboxes.forEach((checkbox, index) => {
                if (checkbox.checked) {
                    checkedCols.push(index + 1);
                }
            });

            const form = document.createElement('form');
            form.method = 'POST';
            form.action = `https://script.google.com/macros/s/${YOUR_SCRIPT_ID}/exec`;

            const nameInput = document.createElement('input');
            nameInput.type = 'hidden';
            nameInput.name = 'name';
            nameInput.value = name;
            form.appendChild(nameInput);

            const dataInput = document.createElement('input');
            dataInput.type = 'hidden';
            dataInput.name = 'data';
            dataInput.value = JSON.stringify({
                name: name,
                checkedCols: checkedCols
            });
            form.appendChild(dataInput);

            document.body.appendChild(form);
            form.submit();
        }
    </script>
</head>

<body>
    <div class="container">
        <input type="text" id="nameInput" placeholder="名前を入力">
        <button onclick="fetchPlanData()">Get</button> <button onclick="sendData()">Post</button>
        <table id="resultTable" border="1"></table>  
    </div>
</body>

</html>
