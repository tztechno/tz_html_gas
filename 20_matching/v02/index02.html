<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body { 
        font-family: Arial, sans-serif; 
        margin: 20px; 
      }
      .container { 
        max-width: 800px; 
        margin: 0 auto; 
      }
      .tab { 
        display: none; 
      }
      .tab.active { 
        display: block; 
      }
      .tab-button { 
        padding: 10px 20px; 
        margin: 5px; 
        cursor: pointer; 
      }
      .tab-button.active { 
        background-color: #4CAF50; 
        color: white; 
      }
      .form-group { 
        margin: 10px 0; 
      }
      .message-box { 
        border: 1px solid #ccc; 
        padding: 10px; 
        margin: 5px 0; 
      }
      table { 
        width: 100%; 
        border-collapse: collapse; 
      }
      th, td { 
        border: 1px solid #ddd; 
        padding: 8px; 
        text-align: left; 
      }
      th { 
        background-color: #f2f2f2; 
      }
      textarea {
        width: 100%;
        min-height: 100px;
      }
      input[type="text"], 
      input[type="number"],
      select {
        width: 100%;
        padding: 8px;
        margin: 5px 0;
      }
      button {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>メッセージ管理システム</h1>
      
      <div>
        <button class="tab-button active" onclick="showTab('profile-input')">プロフィール入力</button>
        <button class="tab-button" onclick="showTab('message-input')">メッセージ入力</button>
        <button class="tab-button" onclick="showTab('profile-list')">プロフィール一覧</button>
        <button class="tab-button" onclick="showTab('message-search')">メッセージ検索</button>
      </div>

      <!-- プロフィール入力 -->
      <div id="profile-input" class="tab active">
        <h2>プロフィール入力</h2>
        <form onsubmit="submitProfileForm(this); return false;">
          <div class="form-group">
            <label>番号:</label>
            <input type="number" name="number" required>
          </div>
          <div class="form-group">
            <label>名前:</label>
            <input type="text" name="name" required>
          </div>
          <div class="form-group">
            <label>プロフィール:</label>
            <textarea name="profile" required></textarea>
          </div>
          <button type="submit">登録</button>
        </form>
      </div>

      <!-- メッセージ入力 -->
      <div id="message-input" class="tab">
        <h2>メッセージ入力</h2>
        <form onsubmit="submitMessageForm(this); return false;">
          <div class="form-group">
            <label>From:</label>
            <select name="from" required></select>
          </div>
          <div class="form-group">
            <label>To:</label>
            <select name="to" required></select>
          </div>
          <div class="form-group">
            <label>Message:</label>
            <textarea name="message" required></textarea>
          </div>
          <button type="submit">送信</button>
        </form>
      </div>

      <!-- プロフィール一覧 -->
      <div id="profile-list" class="tab">
        <h2>プロフィール一覧</h2>
        <table id="profiles-table">
          <thead>
            <tr>
              <th>番号</th>
              <th>名前</th>
              <th>プロフィール</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- メッセージ検索 -->
      <div id="message-search" class="tab">
        <h2>メッセージ検索</h2>
        <div class="form-group">
          <label>From: <select id="search-from" onchange="searchMessages()"></select></label>
          <label>To: <select id="search-to" onchange="searchMessages()"></select></label>
        </div>
        <div id="messages-container"></div>
      </div>
    </div>

    <script>
      // タブ切り替え
      function showTab(tabId) {
        document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.querySelector(`button[onclick="showTab('${tabId}')"]`).classList.add('active');
        
        if (tabId === 'profile-list') {
          loadProfiles();
        } else if (tabId === 'message-input' || tabId === 'message-search') {
          loadProfilesForSelect();
        }
      }

      // プロフィール送信
      function submitProfileForm(form) {
        google.script.run
          .withSuccessHandler(profileSubmitted)
          .submitProfile({
            number: form.number.value,
            name: form.name.value,
            profile: form.profile.value
          });
        form.reset();
        showTab('profile-list');
      }

      function profileSubmitted(profiles) {
        loadProfiles();
      }

      // メッセージ送信
      function submitMessageForm(form) {
        google.script.run
          .withSuccessHandler(messageSubmitted)
          .submitMessage({
            from: form.from.value,
            to: form.to.value,
            message: form.message.value
          });
        form.reset();
        showTab('message-search');
      }

      function messageSubmitted(messages) {
        searchMessages();
      }

      // プロフィール一覧読み込み
      function loadProfiles() {
        google.script.run
          .withSuccessHandler(updateProfilesTable)
          .getAllProfiles();
      }

      function updateProfilesTable(profiles) {
        const tbody = document.querySelector('#profiles-table tbody');
        tbody.innerHTML = profiles.map(profile => `
          <tr>
            <td>${profile[0]}</td>
            <td>${profile[1]}</td>
            <td>${profile[2]}</td>
          </tr>
        `).join('');
      }

      // プロフィール選択肢読み込み
      function loadProfilesForSelect() {
        google.script.run
          .withSuccessHandler(updateProfileSelects)
          .getAllProfiles();
      }

      function updateProfileSelects(profiles) {
        const selects = ['from', 'to', 'search-from', 'search-to'];
        selects.forEach(selectId => {
          const select = document.querySelector(`select[name="${selectId}"], #${selectId}`);
          if (select) {
            select.innerHTML = '<option value="">選択してください</option>' +
              (selectId.includes('search') ? '<option value="all">全て</option>' : '') +
              profiles.map(profile => 
                `<option value="${profile[0]}">${profile[0]} - ${profile[1]}</option>`
              ).join('');
          }
        });
      }

      // メッセージ検索
      function searchMessages() {
        const fromId = document.getElementById('search-from').value || 'all';
        const toId = document.getElementById('search-to').value || 'all';
        google.script.run
          .withSuccessHandler(updateMessages)
          .searchMessages(fromId, toId);
      }

      function updateMessages(messages) {
        const container = document.getElementById('messages-container');
        container.innerHTML = messages.map(msg => `
          <div class="message-box">
            <strong>From:</strong> ${msg[0]}<br>
            <strong>To:</strong> ${msg[1]}<br>
            <strong>Message:</strong> ${msg[2]}
          </div>
        `).join('');
      }

      // 初期表示
      loadProfilesForSelect();
    </script>
  </body>
</html>
